name: storage lab

# main only, plus manual dispatch. Deliberately no pull_request: a fork's PR
# runs the workflow file from the base branch, but it still builds and installs
# the PR's code - and debian/rules is a shell script. On a self-hosted runner
# that is code execution on the box, so the event is excluded rather than
# guarded.
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      pair_with:
        description: >-
          Extra storages to pair bcachefs against for the cross-storage round
          trips, space separated, e.g. "zfs btrfs". Empty runs bcachefs alone.
        default: ""
      pytest_args:
        description: "Extra pytest arguments, e.g. -k Quota"
        default: ""

permissions:
  contents: read

# The lab is a singleton - one node, one set of disks - so runs queue rather
# than race. Not cancel-in-progress: a half-torn-down lab is worse than a wait.
concurrency:
  group: storage-lab
  cancel-in-progress: false

jobs:
  lab:
    runs-on: [self-hosted, pve-bcachefs-lab]
    timeout-minutes: 240
    env:
      PVE_LAB_STATE: /home/runner/lab-state
      LAB: /home/runner/pve-storage-lab
      PAIR_WITH: ${{ github.event.inputs.pair_with || '' }}
      PYTEST_ARGS: ${{ github.event.inputs.pytest_args || '' }}

    steps:
      - name: Check out the plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Check out the lab
        uses: actions/checkout@v4
        with:
          repository: arki05/pve-storage-lab
          path: lab

      # Always built, never reused. A base image carries whatever the
      # distribution shipped the day it was made, and a variant carries a DKMS
      # module built against that kernel - reusing them means a run can pass
      # against packages nobody has shipped for weeks. The ISO is kept, since
      # it is a fixed release; everything derived from it is not.
      - name: Build the base image
        run: |
          set -euo pipefail
          rm -rf "$PVE_LAB_STATE/images" "$PVE_LAB_STATE/build" "$PVE_LAB_STATE/bake"
          cd "$GITHUB_WORKSPACE/lab" && make image

      # This repository tests *this* plugin. Another backend is only worth
      # booting here as the other end of a cross-storage round trip - a zfs
      # suite run in the pve-bcachefs repo would take an hour to tell us
      # nothing about pve-bcachefs. So extra storages add pairs, never their
      # own suite.
      - name: Prepare the lab
        run: |
          set -euo pipefail
          args=(--profile-dir "$GITHUB_WORKSPACE/plugin/test/profile")
          for p in $PAIR_WITH; do
            args+=(--profile-dir "$GITHUB_WORKSPACE/lab/profiles/$p")
          done
          [ -n "$PAIR_WITH" ] && args+=(--cross)
          cd "$GITHUB_WORKSPACE/lab"
          # Two nodes: migration is the only thing that needs them, and it is
          # the part of a storage plugin most likely to be quietly missing.
          ./bin/lab run "${args[@]}" --nodes 2 --disk-size 6G --phase prepare

      # Separate steps, so a red step names what broke rather than burying it
      # in a combined log.
      - name: Suite - bcachefs
        run: cd "$GITHUB_WORKSPACE/lab" && ./bin/lab run --phase suite --only bcachefs -- $PYTEST_ARGS

      - name: Suite - cross-storage round trips
        if: env.PAIR_WITH != ''
        run: cd "$GITHUB_WORKSPACE/lab" && ./bin/lab run --phase suite --only cross -- $PYTEST_ARGS

      # Always: a suite that failed is exactly when the verdict matters. The
      # exit status here comes from *unexpected* failures only, so a backend's
      # declared known bugs do not turn the run red every time and hide the day
      # something new breaks.
      - name: Report
        if: always()
        run: cd "$GITHUB_WORKSPACE/lab" && ./bin/lab run --phase report

      - name: Collect results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storage-lab-results
          path: |
            /home/runner/lab-state/labs/lab/results/
          if-no-files-found: warn
          retention-days: 30

      - name: Tear down
        if: always()
        run: cd "$GITHUB_WORKSPACE/lab" && ./bin/lab run --phase teardown || true

      - name: Discard the images
        if: always()
        run: |
          rm -rf "$PVE_LAB_STATE/images" "$PVE_LAB_STATE/build" \
                 "$PVE_LAB_STATE/bake" "$PVE_LAB_STATE/labs"
          du -sh "$PVE_LAB_STATE" 2>/dev/null || true
