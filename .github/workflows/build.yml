name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      # actions/checkout needs node, which the plain debian image lacks
      - name: Prepare container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends nodejs ca-certificates

      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          # build-essential is required by dpkg-buildpackage itself, even for an
          # Architecture: all package with nothing to compile
          apt-get install -y --no-install-recommends \
            build-essential debhelper devscripts lintian perl

      # Every patch script in the directory, so adding one cannot leave it
      # unchecked - which is how the rename to patch-pve.pl went unnoticed:
      # this step named a single file and started failing on a path that no
      # longer existed.
      - name: Check the patch scripts parse
        run: |
          set -eu
          for script in patches/*.pl; do
            echo "checking $script"
            perl -c "$script"
          done

      - name: Build
        run: dpkg-buildpackage -b -us -uc

      - name: Lintian
        run: lintian ../pve-bcachefs_*_all.deb || true

      - name: Collect
        run: |
          mkdir -p dist
          mv ../pve-bcachefs_*.deb dist/
          mv ../pve-bcachefs_*.buildinfo ../pve-bcachefs_*.changes dist/ 2>/dev/null || true
          ls -l dist/

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deb
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
          generate_release_notes: true

      # Tell the apt repository to rebuild its indices now rather than waiting
      # for its nightly run. Optional: without the token the release still
      # lands, it just shows up in the repository a little later.
      - name: Trigger apt repository publish
        env:
          DISPATCH_TOKEN: ${{ secrets.APT_REPO_DISPATCH_TOKEN }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "APT_REPO_DISPATCH_TOKEN is not set - skipping."
            echo "The release will be picked up by the apt repo's nightly run."
            exit 0
          fi
          # workflow_dispatch rather than repository_dispatch: it needs only the
          # Actions permission, whereas repository_dispatch needs Contents:write
          # - which would also grant push access to this repository's code.
          curl -fsS -X POST \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/arki05/apt.arki05.com/actions/workflows/publish.yml/dispatches \
            -d '{"ref":"main"}'
          echo "dispatched"
