# What this backend cannot do.
#
# These are limitations, not defects: every test runs against every backend,
# and the ones a backend genuinely cannot satisfy are declared here rather than
# skipped. A skip would mean the test never ran and nothing said so - which is
# how linked clones went untested on bcachefs for a whole day.
#
# Declared by capability marker rather than by test name, because names drift
# and capabilities do not. If one of these starts passing it is reported as a
# stale expectation, which is a finding: the backend gained something, or the
# declaration was wrong to begin with.

[[expected]]
profile = "bcachefs"
marker = "ct_resize_visible"
kind = "limitation"
reason = "the rootfs is a subvolume on a much larger filesystem, so df inside reports the filesystem rather than the quota - the limit is real and simply not visible from in there"

[[expected]]
profile = "bcachefs"
marker = "snapshot_migration"
kind = "limitation"
reason = """
A bcachefs VM disk is a raw image and a container rootfs is a subvolume, so
the plugin inherits raw+size and tar+size as its export formats - neither of
which has anywhere to put a snapshot. PVE checks before it starts and refuses
with "non-migratable snapshot exists" rather than dropping them silently,
which is the right failure. Carrying snapshots across would need a
send/receive stream format, and bcachefs has none. Every backend without one
behaves the same way, lvm-thin included.
"""

[[expected]]
profile = "bcachefs"
test = "*test_the_filesystem_reports_itself_clean*"
kind = "known-bug"
reason = """
bcachefs logs one failed data read per QEMU open of a VM image, at offset 0.
Reproduced on 1.39.5 and 1.39.6; independent of compression, replication and
aio mode, and not reproducible with dd at any block size. Recovered with
data-replicas >= 2, logged unrecovered on a single device. Detected and
reported, not silent, and no test has shown data loss - but not diagnosed
either, so this is not a statement that VM images are safe.
"""
